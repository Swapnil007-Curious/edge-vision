# Ablation d: the CNN-transformer hybrid with v2 features and the v2 recipe. Needs a processed dir
# from experiments/preprocess_v2.yaml; processed_dir is a Kaggle placeholder.
experiment: d_hybrid_v2feat_v2recipe
feature_set: v2
recipe: v2
model:
  name: hybrid
  dim: 256
  num_stages: 3
  conv_blocks: 2
  kernel_size: 17
  expansion_dim: 512
  conv_dropout: 0.2
  num_heads: 4
  ff_dim: 512
  attention_dropout: 0.1
  head_dropout: 0.4
  late_dropout_start: 0.5
processed_dir: /kaggle/working/processed_v2
split:
  mode: signer_independent
  n_test_signers: 4
  n_val_signers: 3
  val_fraction: 0.1
  test_fraction: 0.1
  seed: 42
epochs: 150
batch_size: 256
lr: 5.0e-4
weight_decay: 0.05
warmup_fraction: 0.05
label_smoothing: 0.1
grad_clip: 1.0
patience: 30
ema_decay: 0.999
augment:
  affine_p: 0.8
  temporal_p: 0.5
  jitter_p: 0.5
  frame_dropout_p: 0.5
  time_mask_p: 0.5
  landmark_mask_p: 0.3
  hand_rotation_p: 0.5
num_threads: 4
output_root: results/runs
