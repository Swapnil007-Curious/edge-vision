# Ablation b: the v1 CNN and v1 recipe (train_cnn.yaml) with v2 features. Needs a processed dir
# from experiments/preprocess_v2.yaml; processed_dir is a Kaggle placeholder.
experiment: b_cnn_v2feat_v1recipe
feature_set: v2
recipe: v1
model:
  name: cnn
  channels: 192
  num_blocks: 6
  kernel_size: 5
  block_dropout: 0.2
  head_dropout: 0.3
processed_dir: /kaggle/working/processed_v2
split:
  mode: signer_independent
  n_test_signers: 4
  n_val_signers: 3
  val_fraction: 0.1
  test_fraction: 0.1
  seed: 42
epochs: 60
batch_size: 256
lr: 1.0e-3
weight_decay: 0.05
warmup_fraction: 0.05
label_smoothing: 0.1
grad_clip: 1.0
patience: 15
augment:
  affine_p: 0.8
  temporal_p: 0.5
  jitter_p: 0.5
num_threads: 4
output_root: results/runs
