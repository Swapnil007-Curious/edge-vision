# Ablation c: the v1 CNN with v2 features and the v2 recipe (150 epochs, patience 30, EMA of
# weights, extra augmentations). Needs a processed dir from experiments/preprocess_v2.yaml;
# processed_dir is a Kaggle placeholder.
experiment: c_cnn_v2feat_v2recipe
feature_set: v2
recipe: v2
model:
  name: cnn
  channels: 192
  num_blocks: 6
  kernel_size: 5
  block_dropout: 0.2
  head_dropout: 0.3
processed_dir: /kaggle/working/processed_v2
split:
  mode: signer_independent
  n_test_signers: 4
  n_val_signers: 3
  val_fraction: 0.1
  test_fraction: 0.1
  seed: 42
epochs: 150
batch_size: 256
lr: 1.0e-3
weight_decay: 0.05
warmup_fraction: 0.05
label_smoothing: 0.1
grad_clip: 1.0
patience: 30
ema_decay: 0.999
augment:
  affine_p: 0.8
  temporal_p: 0.5
  jitter_p: 0.5
  frame_dropout_p: 0.5
  time_mask_p: 0.5
  landmark_mask_p: 0.3
  hand_rotation_p: 0.5
num_threads: 4
output_root: results/runs
