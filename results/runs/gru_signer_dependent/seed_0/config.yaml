model:
  name: gru
  proj_dim: 192
  hidden_size: 128
  num_layers: 2
  input_dropout: 0.2
  rnn_dropout: 0.2
  head_dropout: 0.3
processed_dir: /kaggle/working/processed
split:
  mode: signer_dependent
  n_test_signers: 4
  n_val_signers: 3
  val_fraction: 0.1
  test_fraction: 0.1
  seed: 42
epochs: 60
batch_size: 256
lr: 0.001
weight_decay: 0.05
warmup_fraction: 0.05
label_smoothing: 0.1
grad_clip: 1.0
patience: 15
augment:
  affine_p: 0.8
  temporal_p: 0.5
  jitter_p: 0.5
  rotation_deg: 15.0
  scale_min: 0.85
  scale_max: 1.15
  translate: 0.1
  window_min: 0.8
  jitter_std: 0.01
num_threads: 4
output_root: /kaggle/working/edge-vision/results/runs
